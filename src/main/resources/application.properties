spring.application.name=pocket-estate
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/storage-desk}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.demo-data-enabled=${APP_DEMO_DATA_ENABLED:false}
app.demo-username=${APP_DEMO_USERNAME:demo}
app.demo-password=${APP_DEMO_PASSWORD:}
spring.flyway.enabled=${FLYWAY_ENABLED:false}
