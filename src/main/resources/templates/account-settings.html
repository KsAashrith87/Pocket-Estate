<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account settings | Pocket Estate</title>
    <link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/overrides.css"><link rel="stylesheet" href="/auth.css"><link rel="stylesheet" href="/profile.css">
</head>
<body class="login-page">
<main class="settings-card">
    <div class="brand login-brand"><span class="brand-mark">P</span><span>Pocket<span class="brand-light">Estate</span></span></div>
    <a class="back-link" href="/">← Back to dashboard</a>
    <p class="eyebrow">Account center</p><h1>Account settings.</h1>
    <div class="login-alert" th:if="${param.error}">Please check your account details.</div>
    <div class="login-success" th:if="${param.saved}">Profile updated successfully.</div>
    <div class="settings-avatar" th:if="${user.profilePicture}"><img th:src="${user.profilePicture}" alt="Profile picture"></div>
    <div class="settings-avatar initials" th:unless="${user.profilePicture}" th:text="${accountInitials}">PE</div>
    <form method="post" action="/settings/account" enctype="multipart/form-data" th:object="${profileForm}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>First name<input type="text" th:field="*{firstName}" required></label>
        <label>Last name<input type="text" th:field="*{lastName}" required></label>
        <label>Email address<input type="email" th:field="*{email}" required></label>
        <label>Profile picture <span class="optional">optional</span><input type="file" th:field="*{profilePicture}" accept="image/*"></label>
        <button class="primary-button login-button" type="submit">Save profile</button>
    </form>
    <button class="secondary-button settings-password-button" onclick="document.getElementById('password-modal').showModal()">Change password</button>
    <form method="post" action="/logout" class="settings-logout" onsubmit="return confirm('Are you sure you want to sign out?');"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="text-button" type="submit">Log out</button></form>
</main>
<dialog id="password-modal"><form method="post" action="/account/password"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="button" class="close-button" onclick="this.closest('dialog').close()">×</button><p class="eyebrow">Account security</p><h2>Change password</h2><label>Current password<input type="password" name="currentPassword" required></label><label>New password<input type="password" name="newPassword" minlength="8" required></label><label>Confirm new password<input type="password" name="confirmPassword" minlength="8" required></label><button class="primary-button" type="submit">Update password</button></form></dialog>
</body>
</html>
