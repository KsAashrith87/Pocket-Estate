services:
  - type: web
    name: storage-desk
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8080
      - key: DDL_AUTO
        value: validate
      - key: FLYWAY_ENABLED
        value: true
      - key: THYMELEAF_CACHE
        value: true
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: APP_DEMO_DATA_ENABLED
        value: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
